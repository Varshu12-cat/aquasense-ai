apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aquasense-ai-backend
  namespace: aquasense-ai-prod
  labels:
    cloud.googleapis.com/location: us-central1
    app: aquasense-ai
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: aquasense-cloud-run-sa@aquasense-ai-prod.iam.gserviceaccount.com
      containers:
      - image: us-central1-docker.pkg.dev/aquasense-ai-prod/aquasense-registry/backend:latest
        ports:
        - name: http1
          containerPort: 8000
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
        env:
        - name: APP_ENV
          value: "production"
        - name: GCP_PROJECT_ID
          value: "aquasense-ai-prod"
        - name: GCP_REGION
          value: "us-central1"
        - name: GCS_BUCKET_NAME
          value: "aquasense-ai-raw-telemetry"
        - name: BIGQUERY_DATASET
          value: "aquasense_dw"
        - name: BIGQUERY_TABLE
          value: "water_consumption_hourly"
