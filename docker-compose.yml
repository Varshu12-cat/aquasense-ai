version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: aquasense-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=demo
      - DEBUG=true
      - GCP_PROJECT_ID=aquasense-ai-prod
      - GCS_BUCKET_NAME=aquasense-ai-raw-telemetry
      - BIGQUERY_DATASET=aquasense_dw
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: aquasense-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

networks:
  default:
    name: aquasense-network
