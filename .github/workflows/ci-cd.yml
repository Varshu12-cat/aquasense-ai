name: AquaSense AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'aquasense-ai-prod' }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  REGISTRY_NAME: aquasense-registry
  BACKEND_SERVICE_NAME: aquasense-backend

jobs:
  # ============================================================================
  # 1. Automated Test & Lint Validation
  # ============================================================================
  test:
    name: Backend Pytest & Frontend Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Unit & Integration Tests
        run: |
          export PYTHONPATH="."
          pytest -v --junitxml=pytest-results.xml

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

  # ============================================================================
  # 2. Container Build & Google Cloud Run Deployment
  # ============================================================================
  deploy-cloud-run:
    name: Build Docker & Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check GCP Credentials Availability
        id: check_credentials
        run: |
          if [ -n "${{ secrets.GCP_SA_KEY }}" ] || [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "Google Cloud credentials detected. Proceeding to build & deployment."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::GCP secrets not detected. Skipping production Cloud Run deployment step (guard enforced)."
          fi

      # Authenticate via Workload Identity Federation (Preferred) or Service Account Key
      - name: Authenticate to Google Cloud
        if: steps.check_credentials.outputs.has_creds == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.check_credentials.outputs.has_creds == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.check_credentials.outputs.has_creds == 'true'
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Backend Docker Image
        if: steps.check_credentials.outputs.has_creds == 'true'
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_NAME }}/backend:${{ github.sha }}"
          LATEST_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_NAME }}/backend:latest"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" -f Dockerfile .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      - name: Deploy to Cloud Run
        if: steps.check_credentials.outputs.has_creds == 'true'
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE_NAME }} \
            --image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_NAME }}/backend:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="APP_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }}"
